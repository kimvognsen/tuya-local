# ============================================================
# eeese Luna Dehumidifier - Tuya Local
# Version 3 - November 2026
#
# Product ID: 5wc50g3lt3bzbai2
# Protocol: Tuya 3.5
#
# Supported features:
# - Dehumidifier (on/off)
# - Target humidity
# - Current humidity
# - Water tank full
# - Defrost status
# - Timer
# - Remaining time
# - Ionizer
# - Child lock
# ============================================================

name: eeese Luna Dehumidifier

products:
  - id: 5wc50g3lt3bzbai2
    manufacturer: eeese
    model: Luna

entities:

  # ----------------------------------------------------------
  # Dehumidifier
  # ----------------------------------------------------------

  - entity: humidifier
    class: dehumidifier
    translation_only_key: extended
    dps:
      - id: 1
        name: switch
        type: boolean

      - id: 2
        name: humidity
        type: integer
        range:
          min: 25
          max: 80
        mapping:
          - step: 5

      - id: 6
        name: current_humidity
        type: integer

  # ----------------------------------------------------------
  # Water tank full
  # DP19 bit 0 - Functionally tested
  # ----------------------------------------------------------

  - entity: binary_sensor
    name: Water tank full
    class: problem
    category: diagnostic
    dps:
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 1
            value: true
          - value: false

  # ----------------------------------------------------------
  # Defrost status
  # DP19 bit 1 - Not yet functionally tested
  # ----------------------------------------------------------

  - entity: binary_sensor
    name: Defrost active
    category: diagnostic
    dps:
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 2
            value: true
          - value: false

  # ----------------------------------------------------------
  # Timer
  # DP17 - Built-in timer
  # ----------------------------------------------------------

  - entity: select
    name: Timer
    category: config
    dps:
      - id: 17
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1H"
            value: "1h"
          - dps_val: "2H"
            value: "2h"
          - dps_val: "3H"
            value: "3h"

  # ----------------------------------------------------------
  # Remaining time
  # DP18 - Remaining timer duration
  # ----------------------------------------------------------

  - entity: sensor
    name: Time remaining
    class: duration
    category: diagnostic
    dps:
      - id: 18
        type: integer
        name: sensor
        unit: h

  # ----------------------------------------------------------
  # Ionizer
  # DP10 - Preferred default state: OFF
  # ----------------------------------------------------------

  - entity: switch
    name: Ionizer
    category: config
    dps:
      - id: 10
        type: boolean
        name: switch

  # ----------------------------------------------------------
  # Child lock
  # DP14 - Preferred default state: OFF
  # ----------------------------------------------------------

  - entity: switch
    name: Child lock
    category: config
    dps:
      - id: 14
        type: boolean
        name: switch
